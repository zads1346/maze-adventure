[project]
name = "maze-adventure"
version = "0.1.0"
description = "Algorithm-driven maze adventure course project with pygame visualization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
